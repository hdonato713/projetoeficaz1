<li class="card {favorite_class}">
  <a href="/favorite/{id}" name="favorite_button" class="favorite-button" title="favoritar ou desfavoritar">{favorite_icon}</a>
  <h3>{title}</h3>
  <p>{details}</p>
  <a href="/update/{id}" name="edit_button" class="edit-button">Editar</a>

</li>
