<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar anotação</title>

    <link rel="stylesheet" href="{{{{ url_for('static', filename='style/getit.css') }}}}">
</head>

<body>
    <h1>Editar anotação</h1>

    <form action="/update" method="POST">
        <input
            type="hidden"
            name="id"
            value="{id}"
        >

        <label for="titulo">Título</label>
        <input
            id="titulo"
            type="text"
            name="titulo"
            value="{titulo}"
            required
        >

        <label for="detalhes">Detalhes</label>
        <textarea
            id="detalhes"
            name="detalhes"
            required
        >{detalhes}</textarea>

        <button type="submit">Salvar</button>

        <button
            type="button"
            onclick="window.location.href='/'"
        >
            Cancelar
        </button>
    </form>
</body>
</html>
